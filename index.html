    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How does Envelope Companion connect to my Actual Budget server?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It connects directly from your iPhone or iPad to your self-hosted Actual Budget server over HTTPS (including PikaPods), Tailscale, or your Home Wi-Fi LAN (port 5006)—with zero middleman servers."
            }
          },
          {
            "@type": "Question",
            "name": "How much does Envelope Companion cost, and can I try it without a server?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You can explore the built-in Demo Mode (Standard and 100-item Large presets) for free with no server required. Envelope Companion Pro is $2.99/month, $19.99/year (with a 7-day free trial), or $49.99 Lifetime with Family Sharing."
            }
          },
          {
            "@type": "Question",
            "name": "Does Envelope Companion support end-to-end encrypted (E2EE) Actual budgets?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can unlock E2EE budgets directly on your device; your encryption key and server credentials are stored securely in the iOS Keychain."
            }
          },
          {
            "@type": "Question",
            "name": "How does receipt scanning and optional BYOK AI work privately?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Receipt OCR runs 100% on-device using Apple Vision. Optional Bring-Your-Own-Key (BYOK) AI categorization is disabled by default; when you explicitly trigger it, only extracted OCR text and active category names are sent directly from your device to your chosen provider (OpenAI, Anthropic, Gemini, or self-hosted Ollama)."
            }
          },
          {
            "@type": "Question",
            "name": "Which devices and iOS versions are supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Envelope Companion is a universal native app for iPhone and iPad supporting iOS 17+ and iOS 26 Liquid Glass, including Home Screen and Lock Screen Widgets, Control Center actions, Siri Shortcuts, and Share Sheet receipt import."
            }
          }
        ]
      }

    <script>
